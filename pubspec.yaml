name: ned_finder
description: "A new Flutter project."

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.8.1


dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^6.2.1  

  # Icons
  cupertino_icons: ^1.0.8
  iconsax: ^0.0.8

  # State Management
  get: ^4.7.2
  get_storage: ^2.1.1

  # Utility Packages
  intl: ^0.20.2
  logger: ^2.5.0
  lottie: ^3.3.1
  badges: ^3.1.2
  shimmer: ^3.0.0
  readmore: ^3.0.0
  image_picker: ^1.2.0
  url_launcher: ^6.3.1
  carousel_slider: ^5.0.0
  connectivity_plus: ^6.1.1
  country_code_picker: ^3.3.0
  flutter_native_splash: ^2.4.6
  http: ^1.4.0
  smooth_page_indicator: ^1.2.1
  shared_preferences: ^2.5.3


  # ----------------(Packages End)-------------------- #

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:

  uses-material-design: true

  # ----------------(Local Assets)-------------------- 
  assets:
    - assets/logos/
    - assets/images/
    # - assets/icons/
    # - assets/icons/categories/
    # - assets/images/onboarding_images/
    # - assets/images/login_and_signup_images/
    # - assets/images/banners/

  # ----------------(Fonts Assets)-------------------- #
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/POPPINS-REGULAR.TTF
        - asset: assets/fonts/POPPINS-BOLD.TTF 
          weight: 700
        - asset: assets/fonts/POPPINS-ITALIC.TTF
          style: italic

 